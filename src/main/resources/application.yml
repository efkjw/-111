server:
  port: 8080

spring:
  application:
    name: takeout
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/takeout?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: 123456

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.takeout.entity
  configuration:
    map-underscore-to-camel-case: true

takeout:
  jwt:
    admin-secret-key: sky-takeout-admin-secret
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: sky-takeout-user-secret
    user-ttl: 7200000
    user-token-name: authentication
